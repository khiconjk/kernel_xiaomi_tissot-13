name: Build PE Tissot Kernel FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex zip unzip curl make python3 libssl-dev libelf-dev

      - name: Clone AOSP Clang + GCC
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "===== CLEAN FLAGS ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' \
            -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +

          echo "===== DEFCONFIG ====="
          make O=out msm8953-perf_defconfig

          echo "===== HARD FIX CONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR
          scripts/config --file out/.config -d CONFIG_WERROR

          # ép ghi đè trực tiếp (quan trọng)
          sed -i 's/CONFIG_CC_STACKPROTECTOR.*/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG.*/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config

          make O=out olddefconfig

          echo "===== BUILD (STABLE MODE) ====="
          make -j2 O=out \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Pack TWRP zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git

          cp ../kernel-output ./Image.gz

          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log