name: Build PE Tissot Kernel TWRP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-tissot.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev gcc g++

      - name: Download toolchains
        run: |
          set -e

          mkdir -p clang
          curl -L --fail \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== DEFCONFIG ====="
          make O=out msm8953-perf_defconfig

          make O=out olddefconfig

          echo "===== DISABLE STACKPROTECTOR ====="
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config

          echo "===== BUILD ====="
          make -j2 O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log