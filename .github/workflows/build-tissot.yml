name: Build PE Tissot Kernel Full Driver FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-tissot.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Patch source clean
        run: |
          set -e

          echo "===== PATCH isp_proc ====="
          python3 <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("*.[ch]"):
              if ".git" in p.parts or "out" in p.parts:
                  continue

              try:
                  s = p.read_text(errors="ignore")
              except:
                  continue

              if "struct isp_proc" in s:
                  if "dual_cam_drop" not in s:
                      s = s.replace("};", "\n\tint dual_cam_drop;\n\tint dual_cam_drop_detected;\n};", 1)
                      p.write_text(s)
                      print("patched:", p)
                      break
          PY

          echo "===== PATCH avtimer (SAFE) ====="
          sed -i '1i extern void msm_isp_set_avtimer_fptr(void *fptr) __attribute__((weak));' \
            techpack/audio/dsp/avtimer.c

          echo "===== REMOVE WERROR ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' \
            -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out msm8953-perf_defconfig

          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true

          make O=out olddefconfig

          echo "===== BUILD ====="
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Show errors
        if: always()
        run: |
          grep -i "error:" build.log | head -50 || true
          tail -100 build.log || true

      - name: Pack zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git
          cp ../kernel-output ./Image.gz
          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log
