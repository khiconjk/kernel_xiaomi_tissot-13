name: Build Tissot Kernel (CAF FIX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: thirteen

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev

      - name: Clone GCC 4.9 (ARM64)
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc64

      - name: Clone GCC 4.9 (ARM32)
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git gcc32

      - name: Build kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc64/bin/aarch64-elf-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc32/bin/arm-eabi-

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "===== REMOVE WERROR ====="
          find . \
            -path './.git' -prune -o \
            -path './out' -prune -o \
            -type f \
            -print0 | xargs -0 sed -i \
              -e 's/-Werror=[A-Za-z0-9_-]*//g' \
              -e 's/-Werror//g'

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          make O=out ARCH=arm64 olddefconfig

          echo "===== BUILD (GCC 4.9) ====="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f -exec ls -lh {} \;

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
          else
            echo "ERROR: No kernel image"
            exit 1
          fi

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Tissot Kernel
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          zip -r9 ../TWRP-Kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            TWRP-Kernel.zip
            kernel-output
            build.log