name: Build Tissot TWRP Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernel and TWRP flashable zip
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: thirteen
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build packages
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            zip \
            unzip \
            curl \
            make \
            python3 \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone clang toolchain
        run: |
          set -e
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          echo "===== Toolchain check ====="
          clang --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

          echo "===== Defconfig ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== Build Image.gz ====="
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz 2>&1 | tee build.log

          echo "===== Boot output files ====="
          find out/arch/arm64/boot -maxdepth 4 -type f -print -exec ls -lh {} \;

          echo "===== Pick kernel image ====="
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
            echo "Using Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
            echo "Using Image.gz"
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kernel-output
            echo "Using Image"
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

          ls -lh kernel-output

      - name: Package TWRP flashable zip
        run: |
          set -euo pipefail

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cd AnyKernel3

          rm -rf .git
          rm -f README.md
          rm -f LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Tissot Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=tissot
          device.name2=Mi A1
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          zip -r9 ../Tissot-Kernel-TWRP.zip . -x '*.git*'

          cd ..

          echo "===== Final zip ====="
          ls -lh Tissot-Kernel-TWRP.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-Kernel-TWRP
          path: |
            Tissot-Kernel-TWRP.zip
            kernel-output
            build.log
