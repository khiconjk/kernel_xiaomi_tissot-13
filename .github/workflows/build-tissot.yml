name: Build PE Tissot Kernel Stable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev gcc g++

      - name: Clone GCC 7.3 toolchains
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git gcc32

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-eabi-"
          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"

          echo "===== TOOLCHAIN ====="
          ${CROSS_COMPILE}gcc --version || true

          echo "===== CLEAN FLAGS ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' \
            -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +

          echo "===== DEFCONFIG ====="
          make O=out msm8953-perf_defconfig

          echo "===== FIX CONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          make O=out olddefconfig

          echo "===== BUILD ====="
          make -j2 O=out \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3

          rm -rf .git
          cp ../kernel-output ./Image.gz

          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log