name: Build PE Tissot Kernel FINAL CLEAN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # =========================
      # PATCH CHUẨN (KHÔNG PHÁ FILE)
      # =========================
      - name: Patch kernel correctly
        run: |
          set -e

          echo "===== PATCH isp_proc SAFE ====="

          python3 <<'PY'
from pathlib import Path

p = Path("include/media/msmb_isp.h")
s = p.read_text()

start = s.find("struct isp_proc")
if start == -1:
    raise SystemExit("isp_proc not found")

brace = s.find("{", start)
end = brace + 1
depth = 1

while end < len(s) and depth:
    if s[end] == "{":
        depth += 1
    elif s[end] == "}":
        depth -= 1
    end += 1

block = s[brace:end]

if "dual_cam_drop" not in block:
    new_block = block[:-1] + "\n\tint dual_cam_drop;\n\tint dual_cam_drop_detected;\n}"
    s = s[:brace] + new_block + s[end:]
    p.write_text(s)
    print("isp_proc patched correctly")
else:
    print("isp_proc already patched")
PY

          echo "===== FIX avtimer (NO CONFLICT) ====="

          # KHÔNG redefine nữa, chỉ include header chuẩn
          sed -i '/msm_isp_set_avtimer_fptr/d' techpack/audio/dsp/avtimer.c
          sed -i '1i #include <media/msmb_isp.h>' techpack/audio/dsp/avtimer.c

          echo "===== REMOVE WERROR ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' {} +

      # =========================
      # BUILD
      # =========================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out msm8953-perf_defconfig

          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true

          make O=out olddefconfig

          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true

          echo "===== BUILD ====="
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Debug
        if: always()
        run: |
          grep -i error build.log | head -50 || true
          tail -200 build.log || true

      - name: Pack
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git
          cp ../kernel-output ./Image.gz
          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log
