name: Build PE Tissot Kernel FINAL REAL FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # =========================
      # FIX ĐÚNG FILE
      # =========================
      - name: Patch kernel correctly
        run: |
          set -e

          echo "===== FIX isp_proc (REAL FILE) ====="

          sed -i '/struct isp_proc {/,/};/ s/};/\n\tint dual_cam_drop;\n\tint dual_cam_drop_detected;\n};/' \
            include/media/msmb_isp.h

          echo "===== FIX avtimer (NO CONFLICT) ====="

          # Xóa mọi dòng sai trước
          sed -i '/msm_isp_set_avtimer_fptr/d' techpack/audio/dsp/avtimer.c

          # Thêm đúng extern (không redefine)
          sed -i '1i extern void msm_isp_set_avtimer_fptr(struct avtimer_fptr_t);' \
            techpack/audio/dsp/avtimer.c

          echo "===== REMOVE WERROR ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' {} +

      # =========================
      # BUILD
      # =========================
      - name: Build
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out msm8953-perf_defconfig

          make O=out olddefconfig

          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Debug
        if: always()
        run: |
          grep -i error build.log | head -50 || true
          tail -200 build.log || true

      - name: Pack
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git
          cp ../kernel-output ./Image.gz
          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log
