name: Build PE Tissot Kernel TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev gcc g++

      - name: Clone GCC 4.9 toolchains
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64

          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Build kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"

          echo "===== TOOLCHAIN CHECK ====="
          ls -lh "$GITHUB_WORKSPACE/gcc64/bin" | head
          ls -lh "$GITHUB_WORKSPACE/gcc32/bin" | head
          ${CROSS_COMPILE}gcc --version
          ${CROSS_COMPILE_ARM32}gcc --version

          echo "===== CLEAN FLAGS ====="
          find . \
            -path './.git' -prune -o \
            -path './out' -prune -o \
            -type f \
            -print0 | xargs -0 sed -i \
              -e 's/-Werror=[A-Za-z0-9_-]*//g' \
              -e 's/-Werror//g' \
              -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g'

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== FIX CONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_REGULAR || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== BUILD IMAGE.GZ-DTB ====="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee build.log || \
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee -a build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f -exec ls -lh {} \;

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
            echo "Using Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
            echo "Using Image.gz"
          else
            echo "ERROR: No kernel image"
            exit 1
          fi

      - name: Pack TWRP flashable zip
        run: |
          set -euo pipefail

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=PixelExperience Tissot Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=tissot
          device.name2=Mi A1
          device.name3=Xiaomi Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          zip -r9 ../PE-Tissot-Kernel-TWRP.zip . -x '*.git*'
          cd ..

          ls -lh PE-Tissot-Kernel-TWRP.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PE-Tissot-Kernel
          path: |
            PE-Tissot-Kernel-TWRP.zip
            kernel-output
            build.log