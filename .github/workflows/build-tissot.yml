name: Build PE Tissot Kernel Full Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-tissot.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Patch broken CAF source
        run: |
          set -e

          echo "===== PATCH isp_proc missing fields ====="
          python3 <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("*.[ch]"))
          patched = False

          for p in files:
              if ".git" in p.parts or "out" in p.parts:
                  continue

              try:
                  s = p.read_text(errors="ignore")
              except Exception:
                  continue

              key = "struct isp_proc"
              idx = s.find(key)
              if idx == -1:
                  continue

              brace = s.find("{", idx)
              semi = s.find(";", idx)

              if brace == -1 or (semi != -1 and semi < brace):
                  continue

              end = brace + 1
              depth = 1

              while end < len(s) and depth:
                  if s[end] == "{":
                      depth += 1
                  elif s[end] == "}":
                      depth -= 1
                  end += 1

              if depth != 0:
                  continue

              body = s[brace:end]

              if "dual_cam_drop" in body and "dual_cam_drop_detected" in body:
                  print(f"Already patched: {p}")
                  patched = True
                  break

              insert = """
                  int dual_cam_drop;
                  int dual_cam_drop_detected;
          """

              ns = s[:end-1] + insert + s[end-1:]
              p.write_text(ns)
              print(f"Patched struct isp_proc in: {p}")
              patched = True
              break

          if not patched:
              raise SystemExit("ERROR: struct isp_proc not found")
          PY

          echo "===== PATCH optional weak avtimer hook ====="
          if ! grep -R "msm_isp_set_avtimer_fptr.*{" drivers/media techpack 2>/dev/null | grep -v "grep" ; then
            cat >> techpack/audio/dsp/avtimer.c <<'EOF'

          /*
           * Build fallback for CAF mismatch.
           * If camera ISP provides a real implementation, the weak symbol is ignored.
           */
          __attribute__((weak)) void msm_isp_set_avtimer_fptr(void *fptr)
          {
          }
          EOF
          fi

          echo "===== CLEAN FLAGS ====="
          find . \
            -path './.git' -prune -o \
            -path './out' -prune -o \
            -type f \
            -print0 | xargs -0 sed -i \
              -e 's/-Werror=[A-Za-z0-9_-]*//g' \
              -e 's/-Werror//g' \
              -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g'

      - name: Build kernel full driver
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== FIX CONFIG ONLY ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== FORCE STACKPROTECTOR OFF ====="
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true

          echo "===== BUILD ====="
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          ls -lh out/arch/arm64/boot/

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

          ls -lh kernel-output

      - name: Show real errors
        if: always()
        run: |
          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|FAILED" build.log | head -100 || true
          echo "===== LAST 200 LINES ====="
          tail -200 build.log || true

      - name: Pack AnyKernel3 TWRP zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=PixelExperience Tissot Kernel Full Driver
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          zip -r9 ../PE-Tissot-Kernel-FullDriver-TWRP.zip . -x '*.git*'
          cd ..

          ls -lh PE-Tissot-Kernel-FullDriver-TWRP.zip

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PE-Tissot-Kernel-FullDriver
          path: |
            PE-Tissot-Kernel-FullDriver-TWRP.zip
            kernel-output
            build.log
