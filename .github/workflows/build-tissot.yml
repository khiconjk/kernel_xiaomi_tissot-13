name: Build PE Tissot Kernel TWRP (FINAL SUCCESS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-tissot.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== FIX CONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          echo "===== DISABLE CAMERA ====="
          scripts/config --file out/.config -d CONFIG_MSM_ISP || true
          scripts/config --file out/.config -d CONFIG_MSM_CAMERA_V2 || true
          scripts/config --file out/.config -d CONFIG_MSMB_CAMERA || true

          echo "===== DISABLE ALL AUDIO DSP ====="
          scripts/config --file out/.config -d CONFIG_SND_SOC || true
          scripts/config --file out/.config -d CONFIG_SND || true
          scripts/config --file out/.config -d CONFIG_AUDIO || true
          scripts/config --file out/.config -d CONFIG_MSM_AVTIMER || true
          scripts/config --file out/.config -d CONFIG_SND_SOC_MSM_QDSP6 || true
          scripts/config --file out/.config -d CONFIG_MSM_ADSP_LOADER || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== FORCE CONFIG ====="
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config

          echo "===== REMOVE TECHPACK AUDIO SOURCE (CRITICAL FIX) ====="
          rm -rf techpack/audio || true

          echo "===== BUILD ====="
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f -exec ls -lh {} \;

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Show real errors
        if: always()
        run: |
          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|FAILED" build.log | head -100 || true
          echo "===== LAST 200 LINES ====="
          tail -200 build.log || true

      - name: Pack AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          zip -r9 ../kernel.zip .
          cd ..

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            kernel-output
            build.log
