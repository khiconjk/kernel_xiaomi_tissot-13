name: Build Tissot TWRP Kernel GCC FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Build kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          echo "===== FORCE FIX GLOBAL FLAGS ====="

          # Fix trong toàn bộ repo (kể cả scripts/)
          grep -RIl "implicit-function-declaration" . \
            --exclude-dir=.git \
            --exclude-dir=out \
            | xargs -r sed -i \
              -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g'

          # Patch trực tiếp Kbuild core (QUAN TRỌNG)
          sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' scripts/Kbuild.include || true
          sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile || true

          echo "===== REMOVE WERROR ====="
          find . \
            -path './.git' -prune -o \
            -path './out' -prune -o \
            -type f \
            -print0 | xargs -0 sed -i \
              -e 's/-Werror=[A-Za-z0-9_-]*//g' \
              -e 's/-Werror//g'

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -e CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== BUILD ====="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration" \
            KBUILD_CFLAGS="-Wno-error -Wno-implicit-function-declaration" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f -exec ls -lh {} \;

          echo "===== PICK KERNEL ====="
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
          else
            echo "ERROR: No kernel image"
            exit 1
          fi

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Tissot Kernel
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          zip -r9 ../TWRP-Kernel.zip .
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            TWRP-Kernel.zip
            kernel-output
            build.log
