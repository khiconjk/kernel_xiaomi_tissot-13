name: Build Tissot TWRP Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernel and TWRP zip
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: thirteen
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip curl make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          echo "===== Defconfig ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== FIX STACKPROTECTOR ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -e CONFIG_CC_STACKPROTECTOR || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== Build ====="
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz 2>&1 | tee build.log

          echo "===== Output ====="
          find out/arch/arm64/boot -type f -exec ls -lh {} \;

          echo "===== Pick kernel ====="
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kernel-output
          else
            echo "ERROR: No kernel image"
            exit 1
          fi

          ls -lh kernel-output

      - name: Package AnyKernel3
        run: |
          set -e

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3

          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Tissot Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          zip -r9 ../Tissot-Kernel-TWRP.zip . -x '*.git*'
          cd ..

          ls -lh Tissot-Kernel-TWRP.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-Kernel
          path: |
            Tissot-Kernel-TWRP.zip
            kernel-output
            build.log
