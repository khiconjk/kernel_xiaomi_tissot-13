name: Build PE Tissot Kernel Full Driver TWRP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-tissot.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip unzip make python3 \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Patch kernel source
        run: |
          set -e

          echo "===== PATCH CAMERA DUAL CAM FIELDS ====="
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("drivers/media/platform/msm/camera_v2/isp/msm_isp_axi_util.c")
          if not p.exists():
              raise SystemExit("ERROR: msm_isp_axi_util.c not found")

          s = p.read_text(errors="ignore")

          s = re.sub(
              r'\n\s*vfe_dev->isp_page->dual_cam_drop\s*=\s*[^;]+;',
              '\n\t/* CAF mismatch fix: dual_cam_drop field not present */',
              s,
              flags=re.S
          )

          s = re.sub(
              r'\n\s*vfe_dev->isp_page->dual_cam_drop_detected\s*=\s*[^;]+;',
              '\n\t/* CAF mismatch fix: dual_cam_drop_detected field not present */',
              s,
              flags=re.S
          )

          p.write_text(s)
          print("patched:", p)
          PY

          echo "===== PATCH AVTIMER WEAK FALLBACK ====="
          python3 <<'PY'
          from pathlib import Path

          p = Path("techpack/audio/dsp/avtimer.c")
          if not p.exists():
              raise SystemExit("ERROR: avtimer.c not found")

          s = p.read_text(errors="ignore")

          if "msm_isp_set_avtimer_fptr_weak_fallback_marker" not in s:
              patch = r'''

          /* msm_isp_set_avtimer_fptr_weak_fallback_marker */
          void __attribute__((weak)) msm_isp_set_avtimer_fptr(struct avtimer_fptr_t avtimer_fptr)
          {
          }
          '''
              s += patch
              p.write_text(s)
              print("patched:", p)
          else:
              print("avtimer already patched")
          PY

          echo "===== REMOVE WERROR ====="
          find . \
            -path "./.git" -prune -o \
            -path "./out" -prune -o \
            -type f \
            -print0 | xargs -0 sed -i \
              -e "s/-Werror=[A-Za-z0-9_-]*//g" \
              -e "s/-Werror//g" \
              -e "s/-implicit-function-declaration/-Wimplicit-function-declaration/g"

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== DEFCONFIG ====="
          make O=out ARCH=arm64 msm8953-perf_defconfig

          echo "===== FIX CONFIG BEFORE OLDDEFCONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          make O=out ARCH=arm64 olddefconfig

          echo "===== FIX CONFIG AFTER OLDDEFCONFIG ====="
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG || true
          scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR || true
          scripts/config --file out/.config -d CONFIG_WERROR || true

          sed -i "s/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g" out/.config || true
          sed -i "s/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g" out/.config || true

          echo "===== BUILD ====="
          make -j2 O=out \
            ARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          ls -lh out/arch/arm64/boot/

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

      - name: Show real errors
        if: always()
        run: |
          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|FAILED" build.log | head -100 || true
          echo "===== LAST 200 LINES ====="
          tail -200 build.log || true

      - name: Pack AnyKernel3 TWRP zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=PixelExperience Tissot Kernel Full Driver
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          zip -r9 ../PE-Tissot-Kernel-FullDriver-TWRP.zip . -x "*.git*"
          cd ..

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PE-Tissot-Kernel-FullDriver
          path: |
            PE-Tissot-Kernel-FullDriver-TWRP.zip
            kernel-output
            build.log
