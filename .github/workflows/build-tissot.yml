name: Build PE Tissot Kernel FINAL FIXED

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex zip unzip curl make python3 libssl-dev libelf-dev

      - name: Download toolchains
        run: |
          set -e

          echo "===== DOWNLOAD CLANG ====="
          mkdir -p clang
          curl -L --retry 5 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902b.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

          echo "===== CLONE GCC64 ====="
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64

          echo "===== CLONE GCC32 ====="
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "===== TOOLCHAIN CHECK ====="
          clang --version
          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

          echo "===== HARD PATCH STACKPROTECTOR ====="
          find . -type f -name "Kconfig*" -exec sed -i \
            -e 's/select CC_STACKPROTECTOR_STRONG/# disabled/g' \
            -e 's/select CC_STACKPROTECTOR/# disabled/g' {} +

          find . -type f -name "Makefile" -exec sed -i \
            -e 's/-fstack-protector-strong//g' \
            -e 's/-fstack-protector//g' {} +

          echo "===== CLEAN FLAGS ====="
          find . -type f ! -path "./.git/*" -exec sed -i \
            -e 's/-Werror//g' \
            -e 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +

          echo "===== DEFCONFIG ====="
          make O=out msm8953-perf_defconfig

          echo "===== FORCE CONFIG ====="
          sed -i 's/CONFIG_CC_STACKPROTECTOR.*/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG.*/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config

          make O=out olddefconfig

          echo "===== BUILD ====="
          make -j2 O=out \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -type f

          cp out/arch/arm64/boot/Image.gz kernel-output

      - name: Pack TWRP zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md LICENSE

          cp ../kernel-output ./Image.gz

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=PixelExperience Tissot Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=tissot
          device.name2=Mi A1
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          zip -r9 ../PE-Tissot-Kernel-TWRP.zip . -x '*.git*'
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PE-Tissot-Kernel
          path: |
            PE-Tissot-Kernel-TWRP.zip
            kernel-output
            build.log