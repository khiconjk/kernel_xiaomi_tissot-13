name: Build PE Tissot Kernel TWRP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-tissot.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_tissot
          ref: thirteen
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex zip unzip curl make python3 libssl-dev libelf-dev gcc g++

      - name: Download toolchains
        run: |
          set -e

          echo "===== DOWNLOAD CLANG ====="
          mkdir -p clang
          curl -L --fail --retry 5 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

          echo "===== CLONE GCC64 ====="
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64

          echo "===== CLONE GCC32 ====="
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32